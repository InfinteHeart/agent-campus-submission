[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduling-agent"
version = "0.1.0"
description = "DeepSeek Flash material review and draft scheduling agent"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.18"]

[project.scripts]
material-agent = "asset_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
